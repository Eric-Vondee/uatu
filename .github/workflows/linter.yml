name: Go quality and security
on:
  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: test, lint, and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          args: --timeout=5m
          version: v2.12.2
          only-new-issues: false
      - name: Install security and documentation tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
      - name: Scan reachable vulnerabilities
        run: govulncheck ./...
      - name: Verify generated API documentation
        run: make docs-check
